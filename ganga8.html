<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us</title>
</head>
<body>
   <h2>Contact Us</h2>
   <form>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="full name" placeholder="Enter your full name"
    maxlength="30" required><br><br>
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="Email Address" placeholder="example@gmail.com" maxlength="50" required> <br><br>
    <label for="phno">Phone Number:</label>
    <input type="tel" id="phone" name="phone number" placeholder="9876543210" maxlength="10" pattern="[0-9]{}" required><br><br>
    <label for="subject">Subject:</label>
    <input type="text" id="subject" name="subject" maxlength="40" required><br><br>
    <label for="message">Message:</label><br><br>
    <textarea name="message" id="message" rows="5" cols="35" placeholder="write your message" maxlength="200" required ></textarea><br><br>
    <input type="submit" name="submit" value="submit"><br><br>
    <input type="reset" name="reset" value="clear"><br><br>
    <p>&copy; 2026</p>
</form> 
</body>
</html>
